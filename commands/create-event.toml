name = "create-event"
description = "Create a new event on the calendar."

prompt = """
Create a new calendar event using the g_calendar_create_event tool.

Summary: {{summary}}
Start: {{start_time}}
End: {{end_time}}
Description: {{description}}
Location: {{location}}
"""

[parameters]
summary = { type = "string", description = "Title of the event", required = true }
start_time = { type = "string", description = "Start: RFC3339, local 2026-05-15T09:00, or a date for all-day", required = true }
end_time = { type = "string", description = "End (default: start + 1 hour)" }
description = { type = "string", description = "Description or notes for the event" }
location = { type = "string", description = "Location of the event" }
